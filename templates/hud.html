<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Meet Transcriber</title>
<style>
  :root{
    --bg:#15101F; --bg2:#0D0A15; --border:rgba(255,255,255,.10);
    --text:#F1F1F6; --muted:#9494A6; --accent:#34D399; --accent-d:#10B981;
    --danger:#F87171; --danger-d:#EF4444; --primary:#7C6FFF;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none}
  html,body{margin:0; width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
  .bar{
    width:100%; height:100%; display:flex; align-items:center; gap:12px;
    padding:0 10px 0 14px; border-radius:16px;
    background:linear-gradient(180deg,var(--bg),var(--bg2));
    border:1px solid var(--border); box-shadow:0 14px 34px rgba(0,0,0,.45);
    -webkit-app-region: drag;
  }
  .mic{position:relative; width:30px; height:30px; flex:none; border-radius:50%;
    display:grid; place-items:center; color:#fff;
    background:radial-gradient(circle,var(--accent),var(--accent-d))}
  .mic svg{width:16px;height:16px; stroke:#fff; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .mic::before{content:""; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid var(--accent); opacity:.55; animation:ripple 1.8s ease-out infinite}
  @keyframes ripple{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.7);opacity:0}}
  .bars{display:flex; align-items:flex-end; gap:3px; height:20px; flex:none}
  .bars span{width:3px; border-radius:2px; background:linear-gradient(180deg,var(--accent),var(--accent-d));
    height:30%; animation:eq 1s ease-in-out infinite}
  .bars span:nth-child(1){animation-delay:0s}
  .bars span:nth-child(2){animation-delay:.15s}
  .bars span:nth-child(3){animation-delay:.3s}
  .bars span:nth-child(4){animation-delay:.2s}
  .bars span:nth-child(5){animation-delay:.1s}
  @keyframes eq{0%,100%{height:20%}50%{height:100%}}
  .info{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
  .status{font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .timer{font-size:15px; color:var(--text); font-weight:700; font-variant-numeric:tabular-nums}
  .actions{display:flex; gap:6px; flex:none; -webkit-app-region: no-drag}
  button{font:inherit; border:0; border-radius:9px; cursor:pointer; display:grid; place-items:center;
    width:32px; height:32px; color:#fff; transition:transform .12s, filter .15s}
  button svg{width:16px;height:16px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round}
  button:active{transform:scale(.92)}
  .stop{background:linear-gradient(135deg,var(--danger),var(--danger-d))}
  .stop:hover{filter:brightness(1.08)}
  .expand{background:rgba(255,255,255,.08); color:var(--muted)}
  .expand:hover{background:rgba(255,255,255,.14); color:var(--text)}
</style>
</head>
<body>
  <div class="bar">
    <div class="mic"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg></div>
    <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="info">
      <span class="status" id="status">Listening…</span>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="actions">
      <button class="expand" id="expandBtn" title="Show app window">
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      </button>
      <button class="stop" id="stopBtn" title="Stop recording">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>
<script>
let t0 = Date.now(), timerInt = null;
function fmt(ms){ const s=Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startTimer(){ if(timerInt) return; t0=Date.now(); timerInt=setInterval(()=>{ document.getElementById('timer').textContent=fmt(Date.now()-t0); },500); }

async function poll(){
  try{
    const r = await fetch('http://127.0.0.1:__PORT__/status');
    const d = await r.json();
    document.getElementById('status').textContent =
      d.status === 'transcribing' ? 'Transcribing…' :
      d.status === 'listening' ? 'Listening…' : d.status;
    if(d.active) startTimer();
  }catch(e){}
}
setInterval(poll, 1000); poll();

document.getElementById('stopBtn').onclick = async () => {
  try{ await fetch('http://127.0.0.1:__PORT__/stop', {method:'POST'}); }catch(e){}
  try{ window.pywebview && window.pywebview.api && window.pywebview.api.hide_hud(); }catch(e){}
};
document.getElementById('expandBtn').onclick = () => {
  try{ window.pywebview && window.pywebview.api && window.pywebview.api.show_main(); }catch(e){}
};
</script>
</body>
</html>
